<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscripción - TechAcademy</title>
    <link rel="stylesheet" href="CSS/MiEstilo.css">
</head>
<body>

    <header>
        <div id="logo">
            <h1>TechAcademy</h1>
        </div>

        <nav class="MENU">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="cursos.html">Cursos</a></li>
                <li><a href="mentoria.html">Mentoría</a></li>
                <li><a href="inscripcion.html" class="btn_destacado">Inscribirse</a></li>
            </ul>
        </nav>
    </header>

    <main class="contenedor principal">

        <section class="formulario">
            <h2>Inscripción a un curso</h2>

            <form action="" method="GET">

                <div class="campo">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" required>
                </div>

                <div class="campo">
                    <label for="apellidos">Apellidos:</label>
                    <input type="text" id="apellidos" name="apellidos" required>
                </div>

                <div class="campo">
                    <label for="correo">Correo electrónico:</label>
                    <input type="email" id="correo" name="correo" required>
                </div>

                <div class="campo">
                    <label for="telefono">Teléfono:</label>
                    <input type="tel" id="telefono" name="telefono" required>
                </div>

                <div class="campo">
                    <label for="curso">Selecciona un curso:</label>
                    <select id="curso" name="curso" required>
                        <option value="">Selecciona una opción</option>
                        <option value="frontend">Desarrollo Web FrontEnd</option>
                        <option value="bases">Base de Datos Robustas</option>
                        <option value="backend">Programación Backend con APIs</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="nivel">Nivel:</label>
                    <select id="nivel" name="nivel" required>
                        <option value="">Selecciona una opción</option>
                        <option value="principiante">Principiante</option>
                        <option value="intermedio">Intermedio</option>
                        <option value="avanzado">Avanzado</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="comentarios">Comentarios:</label>
                    <textarea id="comentarios" name="comentarios" rows="5"></textarea>
                </div>

                <button type="submit">Enviar inscripción</button>

            </form>
        </section>

    </main>

    <footer>&copy; 2026 TechAcademy</footer>

</body>
</html>
